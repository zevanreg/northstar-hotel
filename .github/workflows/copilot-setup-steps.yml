name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/hotel-booking-web/package-lock.json
      - name: Restore .NET dependencies
        run: dotnet restore HotelBooking.slnx
      - name: Install web dependencies
        working-directory: src/hotel-booking-web
        env:
          # Override repo .npmrc in cloud setup so npm never queries the local corporate proxy.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci
